<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alternador de Tema</title>

 
  <style>
    /* Variáveis CSS: definem as cores em um só lugar */
    :root {
      --fundo: #f5f5f5;
      --texto: #1a1a1a;
      --card: #ffffff;
      --acento: #2563eb;
    }

    /* Classe aplicada ao <body> pelo JS muda as variáveis */
    body.tema-escuro {
      --fundo: #1a1a2e;
      --texto: #eaeaea;
      --card: #2a2a3e;
      --acento: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--fundo);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, color 0.3s;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      transition: background 0.3s;
    }

    h1 { font-size: 1.4rem; margin-bottom: 12px; }

    p { font-size: 1rem; margin-bottom: 24px; opacity: 0.8; }

    button {
      padding: 12px 24px;
      background: var(--acento);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>

 
 
    <h1>🌗 Alternador de Tema</h1>
    Clique no botão para alternar entre os temas claro e escuro.


    <button id="botaoTema">Ativar tema escuro</button>
 



 
  <script>
    const botao = document.getElementById('botaoTema');

    botao.addEventListener('click', () => {
      // Alterna a classe 'tema-escuro' no <body>
      document.body.classList.toggle('tema-escuro');

      // Atualiza o texto do botão conforme o estado atual
      const estaEscuro = document.body.classList.contains('tema-escuro');
      botao.textContent = estaEscuro ? 'Ativar tema claro' : 'Ativar tema escuro';
    });
  </script>
</body>
</html>
